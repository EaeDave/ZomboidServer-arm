name: control-plane

on:
  pull_request:
    paths:
      - "panel/**"
      - "scripts/boot-retry.sh"
      - "scripts/boot-retry.test.sh"
      - "scripts/common.sh"
      - "scripts/pz-agent*.sh"
      - "scripts/pz-config*.py"
      - "install.sh"
      - "pzctl"
      - "templates/zomboid-agent.service"
      - ".github/workflows/panel.yml"
      - ".dockerignore"
  push:
    branches:
      - main
      - fex-arm64
      - "feat/**"
    paths:
      - "panel/**"
      - "scripts/boot-retry.sh"
      - "scripts/boot-retry.test.sh"
      - "scripts/common.sh"
      - "scripts/pz-agent*.sh"
      - "scripts/pz-config*.py"
      - "install.sh"
      - "pzctl"
      - "templates/zomboid-agent.service"
      - ".github/workflows/panel.yml"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify host boot telemetry scripts
        run: |
          bash -n scripts/common.sh scripts/boot-retry.sh scripts/boot-retry.test.sh scripts/pz-agent.sh scripts/pz-agent-log.test.sh scripts/pz-agent-worker.test.sh scripts/pz-agent-large-result.test.sh scripts/pz-agent-priv.sh install.sh pzctl
          python3 -m py_compile scripts/pz-config.py
          python3 scripts/pz-config.test.py
          bash scripts/boot-retry.test.sh
          bash scripts/pz-agent-log.test.sh
          bash scripts/pz-agent-worker.test.sh
          bash scripts/pz-agent-large-result.test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build and test control-plane image
        run: docker build --file panel/Dockerfile --tag zomboid-control-plane:ci .
