name: control-plane

on:
  pull_request:
    paths:
      - "panel/**"
      - "host-agent/**"
      - "scripts/boot-retry.sh"
      - "scripts/boot-retry.test.sh"
      - "scripts/common.sh"
      - "scripts/pz-agent*.sh"
      - "scripts/common-lifecycle.test.sh"
      - "scripts/pz-build-update.sh"
      - "scripts/pz-build-update.test.sh"
      - "scripts/pzctl-lifecycle.test.sh"
      - "scripts/zomboid-save-before-stop.sh"
      - "templates/zomboid-b42.service"
      - "templates/zomboid-fex.service"
      - "uninstall.sh"
      - "scripts/pz-config*.py"
      - "install.sh"
      - "pzctl"
      - "templates/zomboid-agent.service"
      - "templates/zomboid-realtime-agent.service"
      - ".github/workflows/panel.yml"
      - ".dockerignore"
  push:
    branches:
      - main
      - fex-arm64
      - "feat/**"
    paths:
      - "panel/**"
      - "host-agent/**"
      - "scripts/boot-retry.sh"
      - "scripts/boot-retry.test.sh"
      - "scripts/common.sh"
      - "scripts/pz-agent*.sh"
      - "scripts/pz-build-update.sh"
      - "scripts/common-lifecycle.test.sh"
      - "scripts/pz-build-update.test.sh"
      - "scripts/pzctl-lifecycle.test.sh"
      - "scripts/zomboid-save-before-stop.sh"
      - "templates/zomboid-b42.service"
      - "templates/zomboid-fex.service"
      - "uninstall.sh"
      - "scripts/pz-config*.py"
      - "install.sh"
      - "pzctl"
      - "templates/zomboid-agent.service"
      - "templates/zomboid-realtime-agent.service"
      - ".github/workflows/panel.yml"
      - ".dockerignore"

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: host-agent/go.mod
          cache-dependency-path: host-agent/go.sum
      - name: Build and test realtime host agent
        working-directory: host-agent
        run: go test ./... && go build ./cmd/pz-agent-core
      - name: Validate realtime systemd unit
        run: |
          sed \
            -e 's|__USER__|root|g' \
            -e 's|__ENVFILE__|/etc/environment|g' \
            -e 's|__AGENT_ENVFILE__|/etc/environment|g' \
            -e 's|__REALTIME_AGENT__|/bin/true|g' \
            -e 's|__CACHEDIR__|/tmp|g' \
            -e 's|__BACKUPS__|/tmp|g' \
            templates/zomboid-realtime-agent.service > /tmp/zomboid-realtime-agent.service
          systemd-analyze verify /tmp/zomboid-realtime-agent.service
      - name: Verify host boot telemetry scripts
        run: |
          bash -n scripts/common.sh scripts/common-lifecycle.test.sh scripts/boot-retry.sh scripts/boot-retry.test.sh scripts/pz-agent.sh scripts/pz-agent-log.test.sh scripts/pz-agent-worker.test.sh scripts/pz-agent-large-result.test.sh scripts/pz-agent-priv.sh scripts/pz-modupdate.sh scripts/pz-modupdate.test.sh scripts/pz-build-update.sh scripts/pz-build-update.test.sh scripts/pzctl-lifecycle.test.sh scripts/zomboid-save-before-stop.sh install.sh uninstall.sh pzctl
          python3 -m py_compile scripts/pz-config.py
          python3 scripts/pz-config.test.py
          bash scripts/pz-modupdate.test.sh
          bash scripts/common-lifecycle.test.sh
          bash scripts/pz-build-update.test.sh
          bash scripts/pzctl-lifecycle.test.sh
          bash scripts/boot-retry.test.sh
          bash scripts/pz-agent-log.test.sh
          bash scripts/pz-agent-worker.test.sh
          bash scripts/pz-agent-large-result.test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build and test control-plane image
        run: docker build --file panel/Dockerfile --tag zomboid-control-plane:ci .
