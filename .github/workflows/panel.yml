name: control-plane

on:
  pull_request:
    paths:
      - "panel/**"
      - "scripts/pz-agent*.sh"
      - "templates/zomboid-agent.service"
      - ".github/workflows/panel.yml"
  push:
    branches:
      - main
      - fex-arm64
      - "feat/**"
    paths:
      - "panel/**"
      - "scripts/pz-agent*.sh"
      - "templates/zomboid-agent.service"
      - ".github/workflows/panel.yml"

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test control-plane image
        run: docker build --file panel/Dockerfile --tag zomboid-control-plane:ci .
